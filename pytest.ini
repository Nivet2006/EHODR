# ==============================================================================
# PURPOSE: Configuration file for Pytest.
# SCOPE: Enforces automated asyncio mode across all test suites.
# DEPENDENCIES: pytest, pytest-asyncio
# RISKS: Overriding asyncio defaults could hide missing markings on manual runs.
# ==============================================================================

[pytest]
asyncio_mode = auto
filterwarnings =
    ignore::pytest.PytestRemovedIn9Warning
    ignore::pydantic.PydanticDeprecatedSince20
