user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Enable high-performance log format
    log_format main_json '{"timestamp":"$time_iso8601",'
                         '"client_ip":"$remote_addr",'
                         '"request":"$request",'
                         '"status":$status,'
                         '"bytes_sent":$body_bytes_sent,'
                         '"duration_sec":$request_time,'
                         '"referrer":"$http_referer",'
                         '"user_agent":"$http_user_agent",'
                         '"trace_id":"$upstream_http_x_trace_id"}';

    access_log /var/log/nginx/access.log main_json;

    # Performance tuning parameters
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Enable Gzip compression to optimize transfer rates
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Define Gateway upstream server grouping matching internal docker-compose host name
    upstream gateway_upstream {
        server gateway:8000;
        keepalive 32;
    }

    # Standard HTTP Server (Exposed on 80)
    server {
        listen 80;
        server_name localhost;

        # Direct security configurations
        client_max_body_size 10M; # Max memory save body size limit
        
        # Enforce rate-limits and proxy settings
        location / {
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            
            # Standard Proxy headers
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Configure Uvicorn connection limits
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Operational metrics endpoint exposure
        location /metrics {
            # In production, restrict this strictly to internal monitoring subnets
            # allow 10.0.0.0/8; 
            # deny all;
            proxy_pass http://gateway_upstream/metrics;
        }
    }

