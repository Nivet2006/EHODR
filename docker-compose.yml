services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: ai_memory_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1536}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEDUP_SIMILARITY_THRESHOLD=${DEDUP_SIMILARITY_THRESHOLD:-0.92}
      - MIN_IMPORTANCE_SCORE_TO_STORE=${MIN_IMPORTANCE_SCORE_TO_STORE:-0.3}
      - MAX_CONTEXT_TOKENS=${MAX_CONTEXT_TOKENS:-4000}
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - memory_net
    volumes:
      - gateway_logs:/app/logs

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: ai_memory_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - memory_net

  postgres:
    image: postgres:15-alpine
    container_name: ai_memory_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-memory_db}
      - POSTGRES_USER=${POSTGRES_USER:-memory_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memory_user} -d ${POSTGRES_DB:-memory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - memory_net

  redis:
    image: redis:7-alpine
    container_name: ai_memory_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - memory_net

volumes:
  qdrant_data:
    driver: local
  pg_data:
    driver: local
  redis_data:
    driver: local
  gateway_logs:
    driver: local

networks:
  memory_net:
    driver: bridge
